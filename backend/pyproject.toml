[project]
name = "backend"
version = "0.1.0"
description = "ProjectFactory API - AI-Powered Project Specification Factory"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "anthropic>=0.101.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",
    "litellm>=1.83.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-socketio>=5.16.1",
    "redis>=7.4.0",
    "truststore>=0.10.0",
    "uvicorn[standard]>=0.46.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# E501: system prompts are long strings; wrapping them hurts readability
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
