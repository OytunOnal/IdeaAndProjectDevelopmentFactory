  note: hypothetical exploration — answer it; do NOT silently edit the model

# ---------- 7. Ambiguity (approve-ish surfaces that are NOT approvals) ----------
- id: ambiguous-hesitant-ok
  context: {phase: specification, gate_doc: architecture}
  message: "hmm tamam gibi ama emin olamadım"
  expect: {action: clarify}
  tags: [ambiguous, turkish]
