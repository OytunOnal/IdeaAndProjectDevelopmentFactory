  expect: {action: approve}
  tags: [multi-intent]
  note: approve NOW + note for a FUTURE doc; future note must not block approval (ideally carried forward)

- id: multi-question-then-decide
  context: {phase: specification, gate_doc: financial_model}
  message: "CAC hesabına ne dahil? ona göre onaylayacağım"
  expect: {action: question}
