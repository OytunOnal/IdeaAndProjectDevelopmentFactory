  message: "tamam da rakip analizi biraz yüzeysel olmuş"
  expect: {action: revise, target: competitor_analysis}
  tags: [ambiguous, turkish]
  note: 'the word "tamam" plus a complaint means revise, not approve'

- id: ambiguous-fine-i-guess
  context: {phase: specification, gate_doc: ux_design}
  message: "fine I guess... though the onboarding flow feels heavy"
  expect: {action: revise, target: ux_design}
