# Golden intent set — discussion-layer action classification.
#
# Schema per case:
#   id:       unique slug
#   context:  phase (discovery|specification|quality|packaging|completed),
#             gate_doc (document awaiting approval, if any)
#   message:  the user's chat message (TR/EN mixed — mirrors real usage)
#   expect:
#     action: approve | revise | rewrite | reopen | improve | question | clarify | no_state_change
#     target: (optional) which document the action should apply to
#   tags:     categories; "regression" = distilled from a real past bug
#   note:     why this case exists / what makes it tricky
#
# Action semantics:
#   approve          -> mark gate doc approved, continue pipeline
#   revise           -> targeted edit of a document based on feedback
#   rewrite          -> full rewrite of the current document
#   reopen           -> go back to an earlier doc/phase
#   improve          -> quality-gate improvement pass (score-raising)
#   question         -> answer; NO pipeline state change
#   clarify          -> ask the user what they meant; NO state change
#   no_state_change  -> off-topic/injection/noise; polite redirect, nothing applied

# ---------- 1. Clear approvals ----------
- id: approve-plain-en
  context: {phase: specification, gate_doc: prd}
  message: "Looks good, continue."
  expect: {action: approve}
  tags: [approve, easy]
  note: baseline clear approve

- id: approve-plain-tr
  context: {phase: discovery, gate_doc: market_research}
  message: "onaylıyorum, devam edelim"
  expect: {action: approve}
  tags: [approve, easy, turkish]
  note: baseline TR approve

- id: approve-slang
  context: {phase: specification, gate_doc: architecture}
  message: "lgtm 🚀"
  expect: {action: approve}
  tags: [approve, slang]
  note: dev-slang + emoji only

- id: approve-shipit
  context: {phase: quality, gate_doc: consistency_report}
  message: "ship it"
  expect: {action: approve}
  tags: [approve, slang]
  note: idiom, no literal "approve" token

- id: approve-emoji-only
  context: {phase: discovery, gate_doc: competitor_analysis}
  message: "👍"
  expect: {action: approve}
  tags: [approve, minimal]
  note: "single emoji — is a thumbs-up an approval? (product decision: yes)"

# ---------- 2. Clear revisions ----------
- id: revise-pricing
  context: {phase: specification, gate_doc: gtm_strategy}
  message: "Change the pricing model to freemium with a pro tier."
  expect: {action: revise, target: gtm_strategy}
  tags: [revise, easy]
  note: baseline targeted edit

- id: revise-add-section
  context: {phase: specification, gate_doc: prd}
  message: "kvkk/gdpr uyumluluğu için ayrı bir bölüm ekler misin"
  expect: {action: revise, target: prd}
  tags: [revise, turkish]
  note: polite-question surface form, imperative intent

- id: revise-audience
  context: {phase: discovery, gate_doc: market_research}
  message: "hedef kitleyi üniversite öğrencileri yerine genç profesyoneller yapalım"
  expect: {action: revise, target: market_research}
  tags: [revise, turkish]
  note: 'the word "yapalim" is an inclusive imperative — still a revise'

# ---------- 3. Rewrite requests ----------
- id: rewrite-classic-bug
  context: {phase: specification, gate_doc: ux_design}
  message: "tekrar yazar mısın bu dökümanı"
  expect: {action: rewrite, target: ux_design}
  tags: [rewrite, regression, turkish]
  note: REAL BUG — was parsed as approve and pipeline moved on

- id: rewrite-fresh-start
  context: {phase: discovery, gate_doc: tech_feasibility}
  message: "bu olmamış, baştan yazalım"
  expect: {action: rewrite, target: tech_feasibility}
  tags: [rewrite, turkish]
  note: rejection + restart, no explicit "rewrite" keyword

- id: rewrite-tone
  context: {phase: specification, gate_doc: prd}
  message: "Rewrite this in a much more formal, investor-ready tone."
  expect: {action: rewrite, target: prd}
  tags: [rewrite]
  note: full rewrite with a style constraint (not a targeted revise)

# ---------- 4. Reopen / going back ----------
- id: reopen-da-step
  context: {phase: quality, gate_doc: consistency_report}
  message: "devil's advocate adımına geri dönelim, orada bir şey atlandı"
  expect: {action: reopen, target: devils_advocate}
  tags: [reopen, regression, turkish]
  note: REAL FLOW — mid-quality return to an earlier gate

- id: reopen-cross-phase
  context: {phase: quality, gate_doc: quality_report}
  message: "let's go back to the market research — the market size looks outdated now"
  expect: {action: reopen, target: market_research}
  tags: [reopen, cross-phase]
  note: reopening a doc from a PREVIOUS phase

- id: reopen-vs-question
  context: {phase: specification, gate_doc: financial_model}
  message: "competitor analysis'te kaç rakip vardı?"
  expect: {action: question}
  tags: [reopen-trap, question, turkish]
  note: MENTIONS an earlier doc but only asks about it — not a reopen

# ---------- 5. Improve (quality gate) ----------
- id: improve-score
  context: {phase: quality, gate_doc: quality_report}
  message: "puanı yükseltmek için önerilenleri uygula"
  expect: {action: improve}
  tags: [improve, regression, turkish]
  note: quality improvement pass, NOT a rewrite of the report itself

- id: improve-before-packaging
  context: {phase: quality, gate_doc: quality_report}
  message: "before we package this, squeeze out whatever quality is left on the table"
  expect: {action: improve}
  tags: [improve, idiom]
  note: idiomatic phrasing, no "apply/improve" keyword

- id: improve-vs-report-rewrite
  context: {phase: quality, gate_doc: quality_report}
  message: "raporda önerilen değişiklikleri dokümanlara işleyelim"
  expect: {action: improve}
  tags: [improve, regression, turkish]
  note: REAL BUG CLASS — target is the SPECS, not the report; must not rewrite the report

