- id: ambiguous-praise-only
  context: {phase: quality, gate_doc: devils_advocate}
  message: "vay be, sert eleştirmiş 😄"
  expect: {action: clarify}
  tags: [ambiguous, turkish]
  note: pure commentary, no decision — do not treat amusement as approval

# ---------- 8. Multi-intent ----------
- id: multi-approve-plus-forward-note
